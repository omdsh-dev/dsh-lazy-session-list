<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="380" viewBox="0 0 1120 380" role="img" aria-labelledby="benchmark-title benchmark-desc">
  <title id="benchmark-title">Measured session-list JSON reduction: 9.33 MB to 0.716 MB</title>
  <desc id="benchmark-desc">An isolated replay of one response with 1272 sessions reduced decoded JSON from 9329237 bytes to 715991 bytes, a 92.3 percent reduction. This measures response size, not network compression or latency.</desc>
  <rect x="1" y="1" width="1118" height="378" rx="20" fill="#ffffff" stroke="#dbe3e9"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="40" y="53" fill="#152d3d" font-size="26" font-weight="700" letter-spacing="-.5">Less JSON on the list path.</text>
    <text x="40" y="82" fill="#607281" font-size="15">Same 1,272 sessions. Same row metadata. A smaller initial payload.</text>
    <text x="1080" y="59" text-anchor="end" fill="#19765e" font-size="42" font-weight="750" letter-spacing="-1.3">−92.3%</text>
    <text x="1080" y="84" text-anchor="end" fill="#607281" font-size="13">decoded JSON</text>
    <text x="40" y="150" fill="#405968" font-size="16" font-weight="600">Original list</text>
    <rect x="226" y="128" width="700" height="42" rx="7" fill="#e4eaef"/>
    <text x="1080" y="155" text-anchor="end" fill="#405968" font-size="21" font-weight="650">9.33 MB</text>
    <text x="40" y="228" fill="#1e718f" font-size="16" font-weight="600">Lazy index</text>
    <rect x="226" y="206" width="700" height="42" rx="7" fill="#f3f7f9"/>
    <rect x="226" y="206" width="53.72" height="42" rx="7" fill="#3388bb"/>
    <text x="1080" y="233" text-anchor="end" fill="#246d96" font-size="21" font-weight="650">0.716 MB</text>
    <text x="226" y="275" fill="#7b8d99" font-size="12">Linear scale · MB = 1,000,000 bytes</text>
    <rect x="40" y="302" width="1040" height="48" rx="8" fill="#f5f8fa"/>
    <text x="56" y="323" fill="#526a7a" font-size="12">Measured 2026-11-06 · One live response, replayed in an isolated plugin context.</text>
    <text x="56" y="340" fill="#526a7a" font-size="12">9,329,237 → 715,991 bytes · Decoded JSON only; no claim about latency or compressed transfer size.</text>
  </g>
</svg>
